<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Fluent · Now Playing</title>
  <!-- CUSTOMIZABLE: theme title and stylesheet path.
       REQUIRED: load the FluentFlyout adapter before app.js. -->
  <link rel="stylesheet" href="css/fluent.css">
</head>
<body>
  <!-- REQUIRED ROOT: app.js toggles is-sleeping on this element. -->
  <main id="dashboard" class="dashboard is-sleeping">
    <section class="player-card" aria-label="Now Playing">
      <div class="player-layout">
      <div class="artwork-wrap">
        <!-- CUSTOMIZABLE: artwork frame and placeholder may be restyled.
             REQUIRED: keep cover and cover-placeholder IDs. -->
        <div id="cover-placeholder" class="cover-placeholder" aria-hidden="true">
          <span class="placeholder-note">♫</span>
          <span class="placeholder-caption">NO ARTWORK</span>
        </div>
        <img id="cover" class="cover" alt="专辑封面" hidden>
      </div>

      <div class="player-content">
        <div class="track-heading">
          <h1 id="track-title">等待正在播放的歌曲</h1>
          <p id="track-subtitle" class="track-subtitle">等待 SMTC 媒体会话</p>
        </div>

        <div class="control-row">
          <!-- Decorative transport glyphs only.
               REQUIRED LIMITATION: Protocol 1.0 does not expose playback commands,
               so these are visual indicators and are intentionally not clickable. -->
          <div class="transport" aria-hidden="true">
            <span class="transport-icon transport-prev">
              <svg viewBox="0 0 24 24"><path d="M6 5v14M19 6 8 12l11 6z"/></svg>
            </span>
            <span id="playback-indicator" class="playback-indicator is-playing">
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 19 12 8 18.5z"/></svg>
            </span>
            <span class="transport-icon transport-next">
              <svg viewBox="0 0 24 24"><path d="M18 5v14M5 6l11 6-11 6z"/></svg>
            </span>
            <span class="transport-icon transport-muted">
              <svg viewBox="0 0 24 24"><path d="M3 3 21 21M8.5 8.5A6 6 0 0 1 18 12M5 12a6 6 0 0 0 9.5 4.8M18 8v4h-4"/></svg>
            </span>
            <span class="transport-icon transport-muted">
              <svg viewBox="0 0 24 24"><path d="M4 7h11a4 4 0 0 1 4 4v1M16 9l3 3 3-3M20 17H9a4 4 0 0 1-4-4v-1M8 15l-3-3-3 3"/></svg>
            </span>
          </div>

          <div class="source-block">
            <span class="source-icon" aria-hidden="true">♫</span>
            <span id="player-name" class="source-name">媒体来源</span>
            <span class="source-chevron" aria-hidden="true">›</span>
            <span id="connection-dot" class="connection-dot is-offline" title="WebSocket 连接状态"></span>
          </div>
        </div>
      </div>

      <div class="timeline">
        <time id="position" class="time-label">0:00</time>
        <div id="progress-track" class="progress-track" role="progressbar"
             aria-label="播放进度" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0" aria-valuetext="等待进度数据">
          <div id="progress-fill" class="progress-fill"></div>
          <span id="progress-knob" class="progress-knob"></span>
        </div>
        <time id="duration" class="time-label time-duration">—:—</time>
      </div>

      <!-- Small, low-contrast diagnostics remain available without competing
           with the visual hierarchy of the reference design. -->
      <div class="micro-status" aria-live="polite">
        <span id="playback-state">等待媒体</span>
        <span class="micro-separator">·</span>
        <span id="adaptation-text">等待进度数据</span>
        <span class="micro-spacer"></span>
        <span id="connection-state">连接中</span>
      </div>
      </div>
    </section>
  </main>

  <!-- REQUIRED INTERFACE: this bundled adapter owns the local token,
       WebSocket reconnect logic, sequence filtering and authenticated cover URL. -->
  <script src="/js/fluentflyout-api.js"></script>
  <!-- CUSTOMIZABLE: renderer presentation and visual smoothing configuration. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
