name: OBS Now Playing build

on:
  push:
    branches:
      - feature/obs-now-playing-m1
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FluentFlyout.sln
      - name: Build WPF application
        run: dotnet build FluentFlyoutWPF/FluentFlyout.csproj --configuration Debug --no-restore
