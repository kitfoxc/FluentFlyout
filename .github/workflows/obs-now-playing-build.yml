name: OBS Now Playing build

on:
  push:
    branches:
      - feature/obs-now-playing-m1
      - fix/tray-exit-dashboard-layout
      - refactor/obs-progress-rendering-m5
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Test Browser progress helpers
        run: node --test FluentFlyoutWPF/Web/js/progress-utils.test.mjs
      - name: Check renderer and browser API syntax
        shell: pwsh
        run: |
          node --input-type=module --check < FluentFlyoutWPF/Web/js/app.js
          if ($LASTEXITCODE -ne 0) { throw "Renderer module syntax check failed." }
          node --check FluentFlyoutWPF/Web/js/fluentflyout-api.js
          if ($LASTEXITCODE -ne 0) { throw "Browser API syntax check failed." }
      - name: Restore solution
        run: dotnet restore FluentFlyout.sln
      - name: Restore OBS service tests
        run: dotnet restore FluentFlyoutWPF.Tests/FluentFlyoutWPF.Tests.csproj
      - name: Test OBS services
        run: dotnet test FluentFlyoutWPF.Tests/FluentFlyoutWPF.Tests.csproj --configuration Debug --no-restore
      - name: Build WPF application
        run: dotnet build FluentFlyoutWPF/FluentFlyout.csproj --configuration Debug --no-restore
      - name: Build WPF Release x64
        run: dotnet build FluentFlyoutWPF/FluentFlyout.csproj --configuration Release --no-restore -p:Platform=x64
      - name: Verify ASP.NET Core runtime is included in self-contained output
        shell: pwsh
        run: |
          $publishDir = "$env:RUNNER_TEMP\FluentFlyout-SelfContained"
          dotnet publish FluentFlyoutWPF/FluentFlyout.csproj --configuration Release --no-restore -p:Platform=x64 --runtime win-x64 --self-contained true --output "$publishDir"
          if ($LASTEXITCODE -ne 0) {
            throw "Self-contained Release publish failed."
          }
          $hostFxr = Get-ChildItem $publishDir -Filter "hostfxr.dll" -Recurse | Select-Object -First 1
          $aspNetCore = Get-ChildItem $publishDir -Filter "Microsoft.AspNetCore.Hosting.dll" -Recurse | Select-Object -First 1
          if (-not $hostFxr -or -not $aspNetCore) {
            throw "Self-contained publish output is missing the .NET host or ASP.NET Core runtime."
          }
          $api = Join-Path $publishDir "Web/js/fluentflyout-api.js"
          if (-not (Test-Path $api)) {
            throw "Bundled browser communication API was not published."
          }
          foreach ($file in @("Web/index.html", "Web/css/fluent.css", "Web/js/app.js", "Web/js/progress-utils.js")) {
            if (Test-Path (Join-Path $publishDir $file)) {
              throw "Renderer resource must be seeded externally, not shipped as a loose file: $file"
            }
          }
      - name: Build WPF Release ARM64
        run: dotnet build FluentFlyoutWPF/FluentFlyout.csproj --configuration Release --no-restore -p:Platform=ARM64
      - name: Build unsigned MSIX package
        shell: pwsh
        run: |
          $packageDir = "$env:RUNNER_TEMP\FluentFlyout-AppxPackages\"
          msbuild FluentFlyoutMSIX\FluentFlyoutMSIX.wapproj /p:Configuration=Release /p:Platform=x64 /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageDir="$packageDir" /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX packaging failed."
          }
          $packageLayout = "FluentFlyoutMSIX/obj/x64/Release/PackageUploadLayout/FluentFlyout"
          $packagedHostFxr = Test-Path (Join-Path $packageLayout "hostfxr.dll")
          $packagedAspNetCore = Test-Path (Join-Path $packageLayout "Microsoft.AspNetCore.Hosting.dll")
          if (-not $packagedHostFxr -or -not $packagedAspNetCore) {
            throw "MSIX package layout is missing the self-contained ASP.NET Core runtime."
          }
